name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    # Calibrated coax navigation gates are FP-sensitive at the iliac→aorta carina bifurcation on
    # x86-linux runners (PUSHABILITY/chirality stall) but stable on macOS/arm64 where they were tuned.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build